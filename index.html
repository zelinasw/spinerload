<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 48px; height: 48px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 16px; font-weight: 500; margin: 0 0 8px 0; }
        p { font-size: 13px; color: #94a3b8; margin: 0; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Loading...</h2>
    <p>Mohon tunggu sebentar...</p>

    <script>
        async function resolveLink() {
            const pathSegments = window.location.pathname.split("/").filter(Boolean);
            const slug = pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : "";

            if (!slug || slug === "index.html" || slug === "admin.html") {
                window.location.replace("https://t.me/koleksikitaV1");
                return;
            }

            try {
                const response = await fetch(`/api/resolve?slug=${slug}`);
                const data = await response.json();

                setTimeout(() => {
                    if (data && data.target_url) {
                        window.location.replace(data.target_url);
                    } else {
                        window.location.replace("https://t.me/koleksikitaV1");
                    }
                }, 1500);
            } catch (err) {
                window.location.replace("https://t.me/koleksikitaV1");
            }
        }

        resolveLink();
    </script>
</body>
</html>
