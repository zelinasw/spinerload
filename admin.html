<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Link Generator Admin (D1)</title>
    <style>
        body {
            background-color: #0f172a; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 600px; background: #1e293b; padding: 30px;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155;
        }
        h2 { margin-top: 0; font-size: 20px; color: #38bdf8; }
        p { font-size: 13px; color: #94a3b8; }
        textarea {
            width: 100%; height: 140px; background: #0f172a; border: 1px solid #475569;
            color: #fff; padding: 12px; border-radius: 6px; font-family: monospace; resize: vertical; box-sizing: border-box; margin-bottom: 15px;
        }
        button {
            background: #0284c7; color: white; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        .result-box {
            margin-top: 20px; background: #0f172a; padding: 14px; border-radius: 6px;
            max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;
            border: 1px solid #334155; display: none; white-space: pre-wrap; word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bulk Link Generator (Database D1)</h2>
        <p>Masukkan daftar link tujuan (satu baris per link). Data akan tersimpan permanen di database global.</p>
        
        <textarea id="bulkInput" placeholder="Contoh:&#10;https://tujuan1.com/video1&#10;https://tujuan2.com/video2"></textarea>
        <button onclick="generateLinks()">Generate Link Massal</button>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        function generateSlug(length = 6) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function generateLinks() {
            const input = document.getElementById('bulkInput').value.trim();
            if (!input) { alert("Masukkan minimal satu link tujuan!"); return; }

            const lines = input.split("\n");
            let itemsToSave = [];
            const baseUrl = window.location.origin;

            lines.forEach(url => {
                let cleanUrl = url.trim();
                if (cleanUrl) {
                    itemsToSave.push({ slug: generateSlug(6), target_url: cleanUrl });
                }
            });

            try {
                let res = await fetch('/api/bulk-save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links: itemsToSave })
                });
                let result = await res.json();

                if (result.success) {
                    let outputText = "Hasil Generate Link Tumbal (Global):\n\n";
                    itemsToSave.forEach(item => {
                        outputText += `${baseUrl}/${item.slug}\n`;
                    });

                    const resultBox = document.getElementById('resultBox');
                    resultBox.style.display = 'block';
                    resultBox.innerText = outputText;
                } else {
                    alert("Gagal menyimpan ke database.");
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi.");
            }
        }
    </script>
</body>
</html>
